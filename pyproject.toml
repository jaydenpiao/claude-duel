[project]
name = "claude-duel"
version = "0.1.0"
description = "Agent-vs-agent staged CTF arena"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jayden Piao" }]
keywords = ["ctf", "llm", "agents", "benchmark", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pydantic>=2.6", "httpx>=0.27", "rich>=13.7"]

[project.optional-dependencies]
dev = [
    "pytest~=9.1.1",
    "pytest-cov~=7.1.0",
    "hypothesis~=6.170",
    "mypy~=2.4.0",
    "ruff~=0.17.1",
    "vulture~=2.16",
    "pylint~=4.1.3",
    "pip-audit~=2.10.1",
]  # pinned to a minor so CI and local runs agree; Dependabot bumps them

[project.urls]
Homepage = "https://github.com/jaydenpiao/claude-duel"
Source = "https://github.com/jaydenpiao/claude-duel"
Issues = "https://github.com/jaydenpiao/claude-duel/issues"
Changelog = "https://github.com/jaydenpiao/claude-duel/blob/main/CHANGELOG.md"

[project.scripts]
duel = "claude_duel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_duel"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "PL", "PT", "C90", "ERA", "TD"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "S101", "TD002"]  # TD003: every TODO links an issue

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "PT011"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m \"not live\" --cov=claude_duel --cov-report=term-missing --cov-fail-under=90"
markers = [
  "live: hits a real provider (skipped without API key)",
  "docker: needs a reachable Docker daemon (skipped otherwise)",
]

[tool.coverage.run]
branch = true

[tool.vulture]
paths = ["src", "tests"]
# framework hooks (pydantic, pytest, logging.Formatter) and persisted match facts read by replay/later modes
ignore_names = ["model_config", "pytestmark", "format", "tokens_used", "elapsed_ms", "rules_version"]
ignore_decorators = ["@model_validator", "@field_validator"]
min_confidence = 60

[tool.pylint.main]
disable = "all"
enable = "duplicate-code"

[tool.pylint.similarities]
min-similarity-lines = 6
ignore-imports = true
ignore-signatures = true
