name: security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 13 * * 1"
permissions: {}
concurrency:  # a new push to a PR cancels its older run; main runs are never cancelled
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository  # no fork PRs on self-hosted
    runs-on: [self-hosted, box]
    timeout-minutes: 30  # a lost runner fails fast instead of holding the queue for 6h
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv venv && uv pip install -e '.[dev]'
      - name: dependency vulnerabilities (runtime + dev, pinned as installed)
        run: uv pip freeze --exclude-editable > ${{ runner.temp }}/req.txt && .venv/bin/pip-audit --strict --disable-pip --no-deps -r ${{ runner.temp }}/req.txt
  secrets:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository  # no fork PRs on self-hosted
    runs-on: [self-hosted, box]
    timeout-minutes: 30  # a lost runner fails fast instead of holding the queue for 6h
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        run: |
          docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="*" \
            -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --exit-code 1
  codeql:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository  # no fork PRs on self-hosted
    runs-on: [self-hosted, box]
    timeout-minutes: 30  # a lost runner fails fast instead of holding the queue for 6h
    permissions:
      contents: read
      actions: read # codeql reads its own workflow run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          upload: never # private repo without code scanning; results are gated below
          output: sarif
      - name: fail on any finding
        run: |
          n=$(jq '[.runs[].results[]] | length' sarif/*.sarif)
          jq -r '.runs[].results[] | "\(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text)"' sarif/*.sarif
          test "$n" -eq 0
  image:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository  # no fork PRs on self-hosted
    runs-on: [self-hosted, box]
    timeout-minutes: 30  # a lost runner fails fast instead of holding the queue for 6h
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t claude-duel:scan .
      - name: trivy image (fails on fixable high/critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: claude-duel:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: trivy config (Dockerfile, workflows)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
