name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python ${{ matrix.python }} && uv pip install -e '.[dev]'
      - run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - run: .venv/bin/mypy src
      - run: .venv/bin/vulture
      - run: .venv/bin/pylint src tests
      - run: docker pull -q python:3.12-slim
      - run: .venv/bin/pytest
