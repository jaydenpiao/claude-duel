name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: runtime install smoke (no dev extras)
        run: uv venv --python ${{ matrix.python }} /tmp/runtime && uv pip install --python /tmp/runtime/bin/python . && /tmp/runtime/bin/duel --help
      - run: uv venv --python ${{ matrix.python }} && uv pip install -e '.[dev]'
      - run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - run: .venv/bin/mypy src
      - run: .venv/bin/python scripts/check_docs.py
      - run: .venv/bin/vulture
      - run: .venv/bin/pylint src tests
      - run: docker pull -q python:3.12-slim@sha256:cb33f7f771ecec2ef1225cf39b159591a040391bd73e4c01f00fdfc4c47611d2
      - run: .venv/bin/pytest
