name: release
on:
  push:
    tags: ["v*.*.*"]
permissions: {}
jobs:
  release:
    runs-on: [self-hosted, box]
    timeout-minutes: 30  # a lost runner fails fast instead of holding the queue for 6h
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --pull --no-cache -t "$IMAGE:$TAG" -t "$IMAGE:latest" .  # fresh base, never a branch-job cache
      - name: scan image before publishing (fails on fixable high/critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push "$IMAGE:$TAG" && docker push "$IMAGE:latest"
      - run: gh release create "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      # Hosted deploy deferred (ADR 0005): a Deployer adapter step goes here later.
