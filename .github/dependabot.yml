version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: bump
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: bump
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: bump
    ignore:
      - dependency-name: python
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
