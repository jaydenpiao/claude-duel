# Real pilot before the final ladder (jayden, 2026-11-19): ladder-final's caps and boards on the two cheapest models.
# Run it twice (fresh seeds from each ladder id), then `duel ladder-compare`. With ladder-pilot-self.toml the
# pilot is hard-capped at $10 in total ($4.50 + $4.50 + $1).
run_date = "2026-11-20"

[sides]
a = ["claude-haiku-5-5"]
b = ["gpt-6-luna"]

[match]
boards_min = 12
boards_max = 48

[budget]
match_max_usd = 4.5
ladder_max_usd = 4.5
basis = "calibrated"

[caps]
build = 24000
allocate = 2000
attack = 8000
max_attempts = 3
effort = "medium"  # one reasoning effort sent to every model (default medium; pending confirmation)

[limits]  # wall clock, the same for both models; the floors already cover haiku and luna (slowest call seen: 39 s)
provider_timeout_s = 300  # one HTTP request (the old 60 s default timed out slower models mid-reply)
call_deadline_s = 600  # one call, retries included
match_deadline_s = 3600  # recorded provider time per half
