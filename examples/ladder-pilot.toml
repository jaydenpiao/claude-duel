# Real pilot before the final ladder (jayden, 2026-11-26): ladder-final's caps, 34 fixed boards and effort high on
# the two cheapest models. Run it twice (fresh seeds from each ladder id), then `duel ladder-compare`. With the two
# controls (ladder-pilot-self.toml, ladder-control-200.toml) the pilot is hard-capped at $15 in total
# ($2.50 + $2.50 + $2 + $8; calibrated $0.90 + $0.90 + $0.88 + $5.30).
run_date = "2026-11-20"

[sides]
a = ["claude-haiku-5-5"]
b = ["gpt-6-luna"]

[match]
boards = 34  # fixed: every pairing plays all 34 boards, no early stop

[budget]
match_max_usd = 2.5
ladder_max_usd = 2.5
basis = "calibrated"

[caps]
build = 24000
allocate = 2000
attack = 8000
max_attempts = 3
effort = "high"  # sent to all 8 models (jayden, 2026-11-26)

[limits]  # wall clock, the same for both models; the floors already cover haiku and luna (slowest call seen: 39 s)
provider_timeout_s = 300  # one HTTP request (the old 60 s default timed out slower models mid-reply)
call_deadline_s = 600  # one call, retries included
match_deadline_s = 3600  # recorded provider time per half
