# Final no-fluke ladder, Plan A (jayden, 2026-11-19): $25 a match, $95 the ladder, ladder-a's per-call caps.
# Budget basis "calibrated": the dry run checks the caps against each model's measured token use (app/calibration.py)
# and refuses any pairing whose boards cannot fit match_max_usd; a per-call hard stop keeps actual spend under both
# caps, and a match it stops early is "capped" (no verdict). At these caps and boards the dry run refuses: the
# fable pairings need fewer boards or a larger per-match cap. Premium models: set allow_premium = true.
# `duel ladder examples/ladder-final.toml --dry-run`; run it twice (each run has fresh seeds from its ladder id), then
# `duel ladder-compare RUN1 RUN2`.
run_date = "2026-11-20"  # required; drives the model cutoffs, never the wall clock

[sides]  # strongest first
a = ["claude-fable-5-2", "claude-opus-5-5", "claude-sonnet-5-5", "claude-haiku-5-5"]
b = ["gpt-6.2-astra", "gpt-6.2-sol", "gpt-6.1-terra", "gpt-6-luna"]

[start_tier]
a = 0
b = 0

[match]
boards_min = 12
boards_max = 38

[budget]
match_max_usd = 25.0
ladder_max_usd = 95.0
basis = "calibrated"

[caps]  # per-call output tokens, the same for both sides
build = 24000
allocate = 2000
attack = 8000
max_attempts = 3
effort = "medium"  # one reasoning effort sent to every model (default medium; pending confirmation)

[limits]  # unset: sized for the slowest model in the plan (here 900 s per request, 1800 s per call, 6660 s per half)
