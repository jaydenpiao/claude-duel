# Final no-fluke ladder, Plan A (jayden, 2026-11-19): $25 a match, $95 the ladder, ladder-a's per-call caps.
# Budget basis "typical": the dry run checks the caps against expected cost, and a per-call hard stop keeps actual
# spend under both caps (a stopped run resumes after raising the cap). Premium models: set allow_premium = true.
# `duel ladder examples/ladder-final.toml --dry-run`; run it twice (each run has fresh seeds from its ladder id), then
# `duel ladder-compare RUN1 RUN2`.
run_date = "2026-11-20"  # required; drives the model cutoffs, never the wall clock

[sides]  # strongest first
a = ["claude-fable-5-2", "claude-opus-5-5", "claude-sonnet-5-5", "claude-haiku-5-5"]
b = ["gpt-6.2-astra", "gpt-6.2-sol", "gpt-6.1-terra", "gpt-6-luna"]

[start_tier]
a = 0
b = 0

[match]
boards_min = 4
boards_max = 8

[budget]
match_max_usd = 25.0
ladder_max_usd = 95.0
basis = "typical"

[caps]  # per-call output tokens, the same for both sides
build = 24000
allocate = 2000
attack = 8000
max_attempts = 3
