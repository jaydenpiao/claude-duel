# No-fluke ladder, option (b): start one tier down (opus vs 5.6-sol). Dollar figures are estimates.
# jayden picks or edits one of ladder-a/b/c before any real run; `duel ladder examples/ladder-a.toml --dry-run`.
run_date = "2026-11-20"  # required; drives the model cutoffs (gpt-5-nano retires 2026-12-11), never the wall clock

[sides]  # strongest first
a = ["claude-fable-5-1", "claude-opus-5-5", "claude-sonnet-5-5", "claude-haiku-5-5"]
b = ["gpt-6-astra", "gpt-5.6-sol", "gpt-6.1-sol", "gpt-6-luna", "gpt-5-mini", "gpt-5-nano"]

[start_tier]
a = 1
b = 1

[match]
boards_min = 4
boards_max = 8

[budget]
match_max_usd = 8.0
ladder_max_usd = 30.0

[caps]  # per-call output tokens, the same for both sides
build = 24000
allocate = 2000
attack = 8000
max_attempts = 3
